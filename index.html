<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hear Me Out</title>
    <meta name="description" content="Everyone secretly picks their most questionable crush. Then you reveal them one by one, put them on the cake, and defend yourself." />
    <meta property="og:title" content="Hear Me Out." />
    <meta property="og:description" content="A party game for 2–12 friends. Pick your most questionable crush, put them on the cake, and defend yourself." />
    <meta name="theme-color" content="#FFF6E9" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved day/night choice before first paint so night mode doesn't flash.
      try {
        if (localStorage.getItem('hmo-theme') === 'night') document.documentElement.dataset.theme = 'night';
      } catch (e) {}
    </script>
    <!-- Firebase settings: hmo-config.js (public/hmo-config.js in the source). Loaded as-is, never bundled. -->
    <script vite-ignore src="./hmo-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
